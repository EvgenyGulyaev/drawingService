name: Deploy Drawing Service

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'cmd/crocodile/**'
      - 'deploy/**'
      - 'docs/**'
      - '**/*.md'
      - '.github/workflows/deploy-crocodile.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: drawing-service-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test -race ./...

      - name: Build drawing service
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o drawing-service.next ./cmd/drawing-service

      - name: Deploy to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "drawing-service.next"
          target: "${{ secrets.VPS_TARGET }}"

      - name: Restart service
        uses: appleboy/ssh-action@v1.0.3
        env:
          VPS_TARGET: ${{ secrets.VPS_TARGET }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: VPS_TARGET
          script: |
            set -eu
            cd "$VPS_TARGET"
            test -s drawing-service.next
            chmod 755 drawing-service.next
            cp -p drawing-service drawing-service.previous
            mv -f drawing-service.next drawing-service
            # Preserve an intentionally stopped service.
            if systemctl is-active --quiet drawing-service; then
              if ! systemctl restart drawing-service; then
                mv -f drawing-service.previous drawing-service
                systemctl restart drawing-service
                exit 1
              fi
              sleep 3
              if ! systemctl is-active --quiet drawing-service; then
                mv -f drawing-service.previous drawing-service
                systemctl restart drawing-service
                exit 1
              fi
            fi
            rm -f drawing-service.previous
