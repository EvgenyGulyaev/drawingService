# Retired domains must not fall through to another site's default vhost.
server {
    listen 80;
    server_name scheduler.publicvm.com www.scheduler.publicvm.com lawyer.scheduler.publicvm.com;
    return 410;
}

server {
    listen 443 ssl http2;
    server_name scheduler.publicvm.com www.scheduler.publicvm.com lawyer.scheduler.publicvm.com;
    ssl_reject_handshake on;
}
