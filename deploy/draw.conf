# Final results may download 144 drawings per player. Limit mutations, not images.
map $request_method $crocodile_mutation_key {
    default "";
    POST $binary_remote_addr;
}
limit_req_zone $crocodile_mutation_key zone=crocodile_api:1m rate=20r/s;

server {
    listen 80;
    server_name draw.wedding-en.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / { return 301 https://draw.wedding-en.ru$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name draw.wedding-en.ru;

    ssl_certificate /etc/letsencrypt/live/draw.wedding-en.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/draw.wedding-en.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /opt/crocodile/current/web;
    index index.html;
    client_max_body_size 1m;
    client_body_timeout 15s;
    access_log /var/log/nginx/crocodile-access.log;
    error_log /var/log/nginx/crocodile-error.log warn;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    location /api/game/ {
        limit_req zone=crocodile_api burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8091;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 20s;
        proxy_send_timeout 20s;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff;
        add_header Referrer-Policy same-origin;
    }
}
